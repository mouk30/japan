name: V308 Yamaguchi fugu photo rights and responsive QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'site/food/index.html'
      - 'scripts/qa_v305_food.py'
      - 'scripts/qa_v306_food.py'
      - 'scripts/qa_v307_food.py'
      - 'scripts/qa_v308_food.py'
      - 'scripts/qa_v308_food_allowlist.py'
      - 'scripts/qa_v153_three_pilot_hubs.cjs'
      - '.github/workflows/v308-food-photo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-fugu-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source, rights, 16 cards, protected SEO and booking
        run: |
          git fetch --depth=1 origin main:refs/remotes/origin/main
          python -m py_compile scripts/qa_v308_food.py scripts/qa_v308_food_allowlist.py scripts/qa_v305_food.py scripts/qa_v306_food.py scripts/qa_v307_food.py
          python scripts/qa_v308_food.py
          python scripts/qa_v307_food.py
          python scripts/qa_v305_food.py
          python scripts/qa_v306_food.py
          node scripts/qa_v153_three_pilot_hubs.cjs
          python scripts/qa_v301_food_pilot.py
          python scripts/qa_v156_existing_official_booking_return.py
          python scripts/qa_v296_intl_booking_cta.py
          test -f site/images/panstar-cruise-clean-2048.webp
          echo 'bbcfa65a0e670060b5ce6fe79b2a9ea3272874b4d96f96799800ec9ccb631bdd  site/images/panstar-cruise-clean-2048.webp' | sha256sum -c -
  responsive-and-external-fallback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Verify 390 768 1440 and deterministic Wikimedia failures
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory site > /tmp/nf308-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/food/ >/dev/null; then break; fi
            sleep 0.3
          done
          curl -fsS http://127.0.0.1:8765/food/ >/dev/null
          node scripts/qa_v305_food_browser.cjs
          node scripts/qa_v306_food_browser.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v308-food-390-768-1440
          path: |
            audit-output/v305/
            audit-output/v306/
          retention-days: 7
          if-no-files-found: ignore
