name: NIPPONFERRY V257 3-city verified stay imagery QA
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v257-photo-rights-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing stay QA and booking boundaries
        run: |
          node scripts/check-v251-stay-kids-boundary.mjs
          node scripts/check-v252-stay-ferry-clarity.mjs
          node scripts/check-v253-stay-images.mjs
      - name: Photo SHA, 28 articles, SEO/canonical and unlicensed hotels check
        run: node scripts/check-v257-osaka-kyoto-tokyo-photos.mjs
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: 3 cities at 320 390 768 1440px real browser QA
        run: node scripts/browser-qa-v257-osaka-kyoto-tokyo-photos.mjs
