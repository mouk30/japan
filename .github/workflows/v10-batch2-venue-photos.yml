name: V10 Batch2 Five Venue Photos
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/v10-batch2-venue-photos.py
      - .github/workflows/v10-batch2-venue-photos.yml
permissions:
  contents: write
jobs:
  publish-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Convert confirmed photographs and update five family guides
        run: python scripts/v10-batch2-venue-photos.py
      - name: Commit local images and updated card references
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/images/venues/ site/things-to-do/
          if ! git diff --cached --quiet; then
            git commit -m "V10 batch2 verified local photo cards"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v10-batch2-venue-review
          path: site/images/venues/v10-batch2-manifest.json
          retention-days: 30
