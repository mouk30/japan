name: Tokyo V61-V80 transit editorial upgrade
on:
  push:
    branches: [main]
    paths:
      - scripts/tokyo_v61_v80_editorial_upgrade.py
      - .github/workflows/tokyo-v61-v80-editorial.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/tokyo_v61_v80_editorial_upgrade.py
      - name: Commit transit editorial updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/japan/tokyo audit-reports/tokyo-v61-v80-editorial-upgrade.json
          if ! git diff --cached --quiet; then
            git commit -m "Improve Tokyo V61-V80 rail lines and transit ticket content"
            git pull --rebase origin main
            git push
          fi
