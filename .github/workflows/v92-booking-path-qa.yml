name: V92 booking path and duplicated CTA final QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/nf-v92-booking-ux.css'
      - 'site/guide/busan-osaka-ferry/index.html'
      - 'site/guide/busan-fukuoka-ferry/index.html'
      - 'site/guide/busan-shimonoseki-ferry/index.html'
      - 'site/guide/busan-tsushima-ferry/index.html'
      - 'site/ferry/index.html'
      - 'site/booking/japan-cruise/index.html'
      - 'scripts/v92_booking_path_browser_qa.py'
      - 'scripts/v90_booking_link_targets.json'
      - '.github/workflows/v92-booking-path-qa.yml'
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install chromium --with-deps
      - name: Verify 18 existing pages on PC and phones; click official booking and route-information paths
        run: python scripts/v92_booking_path_browser_qa.py
      - name: Save real screenshots, click paths, duplicate CTA counts and audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v92-final-booking-path-dedup-qa
          path: audit-output/v92-final-booking-ux/
          retention-days: 45
          if-no-files-found: warn
