name: NIPPONFERRY V260 three stay guides photo rights gate
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v260-stay-three-guides:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve earlier stay KidsStay and ferry boundaries
        run: |
          node scripts/check-v251-stay-kids-boundary.mjs
          node scripts/check-v252-stay-ferry-clarity.mjs
          node scripts/check-v253-stay-images.mjs
          node scripts/check-v254-stay-local-verified.mjs
      - name: Check 3 guides withhold unverified imagery and preserve SEO and booking routes
        run: node scripts/check-v260-stay-three-guides.mjs
      - name: Install Chromium for local render QA
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser QA 3 guides at 320, 390, 768 and 1440 pixels
        run: node scripts/browser-qa-v260-stay-three-guides.mjs
