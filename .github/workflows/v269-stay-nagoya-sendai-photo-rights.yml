name: NIPPONFERRY V269 Nagoya Sendai stay photo rights
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v269-stay-nagoya-sendai:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve V251-V254 KidsStay ferry image and region safeguards
        run: |
          node scripts/check-v251-stay-kids-boundary.mjs
          node scripts/check-v252-stay-ferry-clarity.mjs
          node scripts/check-v253-stay-images.mjs
          node scripts/check-v254-stay-local-verified.mjs
      - name: V269 static photo rights and SEO checks
        run: node scripts/check-v269-stay-nagoya-sendai.mjs
      - name: Install Chromium for local rendering checks
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: V269 local Chromium at 320 390 768 1440
        run: node scripts/browser-qa-v269-stay-nagoya-sendai.mjs
