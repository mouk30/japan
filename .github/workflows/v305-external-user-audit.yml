name: V305 external-user audit - real destination photos, official booking and fuel
on:
  pull_request:
    branches: [main]
    paths:
      - 'site/index.html'
      - 'site/booking/index.html'
      - 'site/guide/busan-osaka-ferry/index.html'
      - 'scripts/qa_v149_hub_routes_credits.py'
      - 'scripts/qa_v300_editorial_layout.py'
      - 'scripts/qa_v305_third_party_booking_truth.py'
      - 'scripts/qa_v305_booking_reality_browser.cjs'
      - '.github/workflows/v305-external-user-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-booking-price-and-seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve original metadata, photos, provenance, booking and Nov 2026 official price
        run: |
          git fetch --quiet --depth=1 origin main:refs/remotes/origin/main
          python scripts/qa_v305_third_party_booking_truth.py
          python scripts/qa_v300_editorial_layout.py
          python scripts/qa_v149_hub_routes_credits.py
          python scripts/qa_v298_approved_cruise_hero.py
          python scripts/qa_v296_intl_booking_cta.py
      - name: No newly indexed articles
        run: |
          if git diff --name-only --diff-filter=A origin/main...HEAD | grep -E '^site/.*\.html$'; then
            echo "BLOCKED: new indexed HTML added"
            exit 1
          fi
  browser-390-768-1440:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Check actual photos and practical UI at 3 viewport widths
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory site > /tmp/nf305-server.log 2>&1 &
          for i in 1 2 3 4 5 6 7 8; do
            if curl -sf http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/qa_v305_booking_reality_browser.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v305-external-user-booking-screenshots
          path: audit-output/v305/
          retention-days: 10
          if-no-files-found: ignore
