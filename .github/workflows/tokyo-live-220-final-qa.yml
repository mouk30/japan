name: Tokyo 220 live browser final QA
on:
  push:
    branches: [main]
    paths:
      - scripts/tokyo_live_220_browser_qa.py
      - .github/workflows/tokyo-live-220-final-qa.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/tokyo_live_220_browser_qa.py
      - name: Commit live QA evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit-reports/tokyo-live-220
          if ! git diff --cached --quiet; then
            git commit -m "Report live mobile browser results for all Tokyo 220 articles"
            git pull --rebase origin main
            git push
          fi
