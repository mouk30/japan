name: V41 research final twenty verified photo subjects
on:
  push:
    branches: [main]
    paths: [.github/workflows/v41-commons-research.yml]
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Search Commons 20 topics with license and source metadata
        run: python scripts/v41_commons_research.py
      - name: Commit candidates without losing concurrent site changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/v41-commons-research.json
          git diff --cached --quiet && exit 0
          git commit -m "V41 research: original photo candidate subjects, authors and licenses"
          git pull --rebase origin main
          git push
