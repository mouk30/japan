name: V120 fix existing image alt texts without changing SEO
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/v120_missing_alt_qa.py'
      - '.github/workflows/v120-missing-alt.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Add descriptive alts to 224 known image tags on 56 existing pages
        run: python scripts/v120_missing_alt_qa.py
      - name: Publish exact eligible files only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/*.html site/*/index.html audit-reports/v120/alt-audit.json
          if git diff --cached --quiet; then exit 1; fi
          git commit -m "V120 restore 224 missing image alternative descriptions on existing guides without SEO changes"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v120-existing-alt-descriptions-evidence
          path: audit-reports/v120/
          retention-days: 45
