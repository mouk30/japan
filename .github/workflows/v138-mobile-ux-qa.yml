name: V138 mobile UX browser QA (6 breakpoints)
on:
  push:
    branches: [main]
    paths:
      - site/index.html
      - site/style.css
      - site/nf-v137-mobile-readability.css
      - site/nf-v138-mobile-polish.css
      - site/nf-premium-v2.js
      - scripts/v138_mobile_qa.mjs
      - .github/workflows/v138-mobile-ux-qa.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  responsive-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run V138 320/360/390/430/768/1440 browser QA
        id: mobileqa
        continue-on-error: true
        run: |
          python3 -m http.server 8757 --directory site --bind 127.0.0.1 >/tmp/v138-site.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID || true" EXIT
          sleep 2
          node scripts/v138_mobile_qa.mjs
      - name: Attach viewport report and eight screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v138-responsive-mobile-ux-visuals
          path: audit-reports/v138/
          retention-days: 21
          if-no-files-found: warn
      - name: Commit browser-verified metrics only
        if: steps.mobileqa.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit-reports/v138/report.json
          git diff --cached --quiet && exit 0
          git commit -m "V138: record verified mobile viewport and menu tests"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fail on visual regression
        if: steps.mobileqa.outcome != 'success'
        run: exit 1
