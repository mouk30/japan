name: Legacy template and media inventory
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/audit_legacy_templates.py'
      - '.github/workflows/legacy-template-audit.yml'
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only HTML image and CTA audit
        run: python3 scripts/audit_legacy_templates.py --root site --out-dir audit-output
      - name: Publish report in job summary
        if: always()
        run: |
          if [ -f audit-output/template-audit.md ]; then
            cat audit-output/template-audit.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload report CSV and Markdown
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-template-audit
          path: audit-output/
          if-no-files-found: warn
