name: V168 public four ferry-connected cruise guides WebP sitemap QA
on:
  push:
    branches: [main]
    paths:
      - "site/things-to-do/amami-naze-cruise-port-day-trip/index.html"
      - "site/things-to-do/naha-cruise-port-day-trip/index.html"
      - "site/things-to-do/motobu-cruise-port-day-trip/index.html"
      - "site/things-to-do/kagoshima-cruise-port-day-trip/index.html"
      - "scripts/qa_v168_live_four_ports.py"
      - ".github/workflows/v168-public-four-ports.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  published-guides-original-real-images-indexability:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Real production HTTP, 4 guide cards, 4 original WebP, sitemap
        run: |
          python -m py_compile scripts/qa_v168_live_four_ports.py
          python scripts/qa_v168_live_four_ports.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v168-production-four-operator-guides-WebP-sitemap
          path: audit-output/v168-public/
          if-no-files-found: warn
