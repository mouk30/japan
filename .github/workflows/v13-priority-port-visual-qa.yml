name: V13 Five Cruise Ports Mobile Live QA
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit-priority-ports-v13.mjs'
      - '.github/workflows/v13-priority-port-visual-qa.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build deployable static website
        run: npm run build
      - name: Audit 15 guides on preview and production PC and mobile
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist > /tmp/v13-priority-preview.log 2>&1 &
          sleep 2
          node scripts/audit-priority-ports-v13.mjs
        env:
          LOCAL_BASE_URL: http://127.0.0.1:8765
          LIVE_BASE_URL: https://www.nipponferry.com
      - name: Publish QA report and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v13-priority-ports-browser-qa
          path: audit-reports/v13-priority-port-visual/
          retention-days: 30
