name: V42 compare kintsugi and ekiben real-photo alternatives
on:
  push:
    branches: [main]
    paths: [.github/workflows/v42-alternative-photo-contact.yml]
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - run: python scripts/v42_alternative_photos.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/v42-image-audit/alternative-contact.b64
          git diff --cached --quiet && exit 0
          git commit -m "V42: verify original image alternatives for bento and kintsugi"
          git pull --rebase origin main
          git push
