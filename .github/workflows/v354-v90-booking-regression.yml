name: V354 V90 booking destination regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/test_v90_booking_destination_health.py'
      - 'scripts/v90_booking_destination_health.py'
      - 'scripts/v90_booking_link_targets.json'
      - '.github/workflows/v354-v90-booking-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v90-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Verify V90 booking destinations and local CTAs
        run: python -m unittest discover -s tests -p 'test_v90_booking_destination_health.py' -v
