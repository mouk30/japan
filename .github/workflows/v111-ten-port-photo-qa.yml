name: V111 ten Japan ports authentic photos and SEO
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/things-to-do/*-cruise-port-day-trip/index.html'
      - 'audit-reports/v111/**'
      - 'scripts/v111_ten_port_photo_audit.py'
      - 'scripts/v111_ten_port_photo_live.py'
      - 'tests/test_v111_ten_port_photo_audit.py'
      - '.github/workflows/v111-ten-port-photo-qa.yml'
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Test 10 WebP SHA-1 bytes, license sources, and preserved SEO data
        run: |
          python -m unittest discover -s tests -p 'test_v111_ten_port_photo_audit.py' -v
          python scripts/v111_ten_port_photo_audit.py
  production:
    needs: source-audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install chromium --with-deps
      - name: Verify 10 production pages at 1440px and 390px
        run: |
          for attempt in 1 2 3; do
            if python scripts/v111_ten_port_photo_live.py; then exit 0; fi
            echo "CDN/browser availability retry $attempt/3"
            if [ "$attempt" -lt 3 ]; then sleep 25; fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v111-photo-source-and-mobile-evidence
          path: audit-output/v111/
          retention-days: 45
