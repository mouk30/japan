name: Tokyo 220 mobile screenshot and photo QA
on:
  push:
    branches: [main]
    paths:
      - site/tokyo-guide.css
      - site/tokyo-card-photos.js
      - scripts/tokyo_mobile_visual_qa.py
      - .github/workflows/tokyo-mobile-visual-qa.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tokyo-mobile-visual-qa
  cancel-in-progress: false
jobs:
  visual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/tokyo_mobile_visual_qa.py
      - name: Save audited screenshots and findings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit-reports/tokyo-mobile-ui
          if ! git diff --cached --quiet; then
            git commit -m "Publish Tokyo mobile browser QA screenshots and findings"
            git pull --rebase origin main
            git push
          fi
