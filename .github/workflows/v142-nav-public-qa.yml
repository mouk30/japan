name: V142 published site navigation keyboard and submenu QA
on:
  push:
    branches: [main]
    paths:
      - site/v301-nav.js
      - site/v301-nav.css
      - scripts/v142_nav_accessibility_qa.py
      - .github/workflows/v142-nav-public-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          python -m pip install playwright
          python -m playwright install chromium
      - name: Check 36 published desktop and mobile route/width combinations
        env:
          NF_V142_BASE: https://www.nipponferry.com
        run: |
          for attempt in 1 2; do
            if python scripts/v142_nav_accessibility_qa.py; then exit 0; fi
            echo "V142 public browser QA failed pass $attempt/2"
            if [ "$attempt" -lt 2 ]; then sleep 20; fi
          done
          exit 1
      - name: Upload public screenshot evidence and JSON results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v142-public-menu-accessibility-visual-evidence
          path: audit-output/v142/
          retention-days: 35
          if-no-files-found: warn
