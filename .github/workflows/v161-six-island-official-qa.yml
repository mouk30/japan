name: V161 six island ports official Tokai weather booking return QA
on:
  push:
    branches: [main]
    paths:
      - "site/things-to-do/tokyo-cruise-port-day-trip/index.html"
      - "site/things-to-do/okata-izu-oshima-cruise-port-day-trip/index.html"
      - "site/things-to-do/niijima-cruise-port-day-trip/index.html"
      - "site/things-to-do/kozushima-cruise-port-day-trip/index.html"
      - "site/things-to-do/miike-miyakejima-cruise-port-day-trip/index.html"
      - "site/things-to-do/kaminato-hachijojima-cruise-port-day-trip/index.html"
      - "scripts/qa_v161_six_island_ferry_booking_return.py"
      - ".github/workflows/v161-six-island-official-qa.yml"
  pull_request:
    branches: [main]
    paths:
      - "site/things-to-do/*-cruise-port-day-trip/index.html"
      - "scripts/qa_v161_six_island_ferry_booking_return.py"
      - ".github/workflows/v161-six-island-official-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-operator-no-new-articles-source-seo-photo-return:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Preserve six originals and verify operator decisions
        run: |
          python -m py_compile scripts/qa_v161_six_island_ferry_booking_return.py
          python scripts/qa_v161_six_island_ferry_booking_return.py
      - name: Original site build regression
        run: node build.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v161-island-original-photo-SEO-booking-qa
          path: audit-output/v161/
          if-no-files-found: warn
