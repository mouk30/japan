name: V361 Repeated Generic Copy Inventory
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/audit-v361-generic-copy.mjs'
      - '.github/workflows/v361-generic-copy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repeated-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/audit-v361-generic-copy.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: v361-repeated-copy-review
          path: audit-reports/v361/
          retention-days: 30
