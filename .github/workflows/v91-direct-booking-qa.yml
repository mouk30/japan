name: V91 direct official booking and preflight QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/nf-v91-direct-booking.css'
      - 'site/guide/busan-osaka-ferry/index.html'
      - 'site/guide/busan-fukuoka-ferry/index.html'
      - 'site/guide/busan-shimonoseki-ferry/index.html'
      - 'site/guide/busan-tsushima-ferry/index.html'
      - 'site/ferry/index.html'
      - 'site/booking/japan-cruise/index.html'
      - 'scripts/v91_one_click_booking_qa.py'
      - 'scripts/v90_booking_link_targets.json'
      - '.github/workflows/v91-direct-booking-qa.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install chromium --with-deps
      - name: Test 18 live screen cases and 16 one-click external booking navigation events
        run: python scripts/v91_one_click_booking_qa.py
      - name: Save screenshots and verified tap/click results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v91-booking-preflight-and-one-click-qa
          path: audit-output/v91-direct-booking/
          retention-days: 30
          if-no-files-found: warn
