name: V68 production 20 article live verification
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v68-live-qa.yml
      - scripts/v68_live_qa.mjs
permissions:
  contents: write
jobs:
  verify-live-twenty:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify public production shows all twenty updated pages
        id: audit
        continue-on-error: true
        run: node scripts/v68_live_qa.mjs
      - name: Preserve live public site report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v68-twenty-live-deploy-checks
          path: audit-reports/v68/production.json
          retention-days: 21
          if-no-files-found: warn
      - name: Commit independent production result
        if: always()
        run: |
          test -f audit-reports/v68/production.json || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit-reports/v68/production.json
          git diff --cached --quiet && exit 0
          git commit -m "V68: document public deployment checks for twenty enhanced articles"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fail on stale production pages
        if: steps.audit.outcome != 'success'
        run: exit 1
