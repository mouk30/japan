name: V359 Booking CTA Label Inventory
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/audit-v359-booking-cta-labels.mjs'
      - '.github/workflows/v359-booking-cta-labels.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cta-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/audit-v359-booking-cta-labels.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: v359-booking-cta-review
          path: audit-reports/v359/
          retention-days: 30
