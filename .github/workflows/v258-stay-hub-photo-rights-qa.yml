name: NIPPONFERRY V258 Stay Hub Photo Rights QA
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stay-hubs-verified-and-safe:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing stay SEO, booking and JPEG origin regressions
        run: |
          node scripts/check-v251-stay-kids-boundary.mjs
          node scripts/check-v252-stay-ferry-clarity.mjs
          node scripts/check-v253-stay-images.mjs
          node scripts/check-v254-stay-local-verified.mjs
      - name: Check 28 pages, 26 cards, source-photo bytes and rights
        run: node scripts/check-v258-stay-hubs-provenance.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Real browser 2 hubs at 320 390 768 1440 pixels
        run: node scripts/browser-qa-v258-stay-hubs.mjs
