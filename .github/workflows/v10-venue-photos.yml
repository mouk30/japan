name: V10 Verified Venue Photo Review
on:
  workflow_dispatch:
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/prepare-v10-photos.py
      - uses: actions/upload-artifact@v4
        with:
          name: v10-photo-review-webp
          path: photo-review/
          retention-days: 30
