name: NIPPONFERRY Premium V2 responsive visual QA
on:
  push:
    branches: [main]
    paths:
      - scripts/nf_premium_v2_visual_qa.py
      - .github/workflows/nf-premium-v2-qa.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Start compiled static site
        run: |
          (python -m http.server 8765 --directory site > /tmp/nf-v2-local-server.log 2>&1 &)
          sleep 2
      - name: Verify 8 key pages on mobile tablet and desktop
        run: python scripts/nf_premium_v2_visual_qa.py
      - name: Publish screenshots and issues
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit-reports/nf-premium-v2
          if ! git diff --cached --quiet; then
            git commit -m "Audit premium maritime headers and mobile interactions at 3 widths"
            git pull --rebase origin main
            git push
          fi
