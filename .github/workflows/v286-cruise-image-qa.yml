name: V286 cruise image inventory and booking QA
on:
  pull_request:
    paths:
      - 'site/**'
      - 'scripts/qa_v286_cruise_image_inventory.py'
      - 'scripts/qa_v147_existing_booking_return.py'
      - 'scripts/qa_v156_existing_official_booking_return.py'
      - '.github/workflows/v286-cruise-image-qa.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m py_compile scripts/qa_v286_cruise_image_inventory.py scripts/qa_v147_existing_booking_return.py scripts/qa_v156_existing_official_booking_return.py
          python scripts/qa_v286_cruise_image_inventory.py
          python scripts/qa_v147_existing_booking_return.py
          python scripts/qa_v156_existing_official_booking_return.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v286-image-booking-audit
          path: audit-output/
