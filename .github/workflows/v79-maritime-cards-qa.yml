name: V79 large cruise and ferry cards PC mobile QA
on:
  push:
    branches: [main]
    paths:
      - 'site/nf-v79-maritime-cards.css'
      - 'scripts/v79_maritime_cards_browser_qa.py'
      - '.github/workflows/v79-maritime-cards-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install chromium --with-deps
      - name: Inspect 2 big cards at 1440px desktop and 390px mobile
        run: python scripts/v79_maritime_cards_browser_qa.py
      - name: Save actual two-card screenshot and checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v79-pc-mobile-maritime-cards
          path: audit-output/v79-maritime/
          if-no-files-found: warn
