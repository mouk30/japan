name: NIPPONFERRY V253 stay image origin and region check
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v253-stay-photo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve V251-V252 stay SEO and booking clarity
        run: |
          node scripts/check-v251-stay-kids-boundary.mjs
          node scripts/check-v252-stay-ferry-clarity.mjs
      - name: Inspect real JPEG bytes, identical blobs, region mismatch notes and CC0 source
        run: node scripts/check-v253-stay-images.mjs
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Responsive screenshotless actual browser checks, 4 widths x 4 pages
        run: node scripts/browser-qa-v253-stay-images.mjs
