name: V11 Parents 15 Practical Guide Upgrade
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/parents-v11-apply.py'
      - 'scripts/parents-v11-manifest.json'
      - '.github/workflows/v11-parents-upgrade.yml'
permissions:
  contents: write
jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install WebP image conversion
        run: python -m pip install Pillow==11.3.0
      - name: Apply checked local photos and walking transport rest safe-return content
        run: python scripts/parents-v11-apply.py
      - name: Publish revised pages and assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/images/venues site/things-to-do audit-reports/parents-v11.json
          if ! git diff --cached --quiet; then
            git commit -m "V11 parents: 15 walking/transport/rest/return plans and licensed WebP"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload exact per-card inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v11-parents-45-card-report
          path: audit-reports/parents-v11.json
          retention-days: 30
