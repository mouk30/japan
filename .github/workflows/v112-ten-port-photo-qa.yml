name: V112 historic source photos and SEO on ten cruise port guides
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/things-to-do/*-cruise-port-day-trip/index.html'
      - 'audit-reports/v112/**'
      - 'scripts/v112_ten_port_photo_audit.py'
      - 'scripts/v112_ten_port_photo_live.py'
      - 'tests/test_v112_ten_port_photo_audit.py'
      - '.github/workflows/v112-ten-port-photo-qa.yml'
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Check source records, 10 historic dates, WebP fingerprints and preserved SEO
        run: |
          python -m unittest discover -s tests -p 'test_v112_ten_port_photo_audit.py' -v
          python scripts/v112_ten_port_photo_audit.py
  production:
    needs: source-audit
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install chromium --with-deps
      - name: Inspect ten public historic-photo guides at desktop and mobile widths
        run: |
          for attempt in 1 2 3; do
            if python scripts/v112_ten_port_photo_live.py; then exit 0; fi
            echo "CDN propagation / browser retrial $attempt of 3"
            if [ "$attempt" -lt 3 ]; then sleep 25; fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v112-20-production-photo-sources-and-history
          path: audit-output/v112/
          retention-days: 45
