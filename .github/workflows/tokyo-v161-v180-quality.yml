name: Tokyo V161-V180 neighborhood quality upgrade
on:
  push:
    branches: [main]
    paths:
      - scripts/tokyo_v161_v180_quality_upgrade.py
      - .github/workflows/tokyo-v161-v180-quality.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/tokyo_v161_v180_quality_upgrade.py
      - name: Save neighborhood guide and image corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/japan/tokyo site/images/tokyo-editorial site/tokyo-card-photos.js audit-reports/tokyo-v161-v180-quality-upgrade.json
          if ! git diff --cached --quiet; then
            git commit -m "Upgrade Tokyo neighborhood V161–V180 editorial and imagery"
            git pull --rebase origin main
            git push
          fi
