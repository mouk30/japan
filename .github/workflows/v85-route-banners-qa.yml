name: V85 panoramic route banners live desktop mobile QA
on:
  push:
    branches: [main]
    paths:
      - 'site/index.html'
      - 'site/ferry/index.html'
      - 'site/nf-v84-route-banners.css'
      - 'scripts/v85_route_banner_browser_qa.py'
      - '.github/workflows/v85-route-banners-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-v85:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install chromium --with-deps
      - name: Test production PC tablet mobile images layout and internal CTAs
        run: python scripts/v85_route_banner_browser_qa.py
      - name: Archive browser screenshots and machine-readable QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v85-sea-routes-pc-mobile
          path: audit-output/v85-route-banners/
          retention-days: 30
          if-no-files-found: warn
