name: V85 panoramic route banners live desktop mobile QA
on:
  push:
    branches: [main]
    paths:
      - 'site/index.html'
      - 'site/ferry/index.html'
      - 'site/nf-v84-route-banners.css'
      - 'scripts/v85_route_banner_browser_qa.py'
      - '.github/workflows/v85-route-banners-qa.yml'
  pull_request:
    paths:
      - 'site/ferry/index.html'
      - 'scripts/v85_route_banner_browser_qa.py'
      - '.github/workflows/v85-route-banners-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-v85:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install chromium --with-deps
      - name: Build PR deployment output for pre-merge browser QA
        if: github.event_name == 'pull_request'
        run: npm run build
      - name: Test production or PR build PC tablet mobile images layout and internal CTAs
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            python3 -m http.server 8767 --bind 127.0.0.1 --directory dist >/tmp/nf85-http.log 2>&1 &
            PID=$!
            trap 'kill $PID || true' EXIT
            sleep 3
            NF85_BASE_URL=http://127.0.0.1:8767 python scripts/v85_route_banner_browser_qa.py
          else
            python scripts/v85_route_banner_browser_qa.py
          fi
      - name: Archive browser screenshots and machine-readable QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v85-sea-routes-pc-mobile
          path: audit-output/v85-route-banners/
          retention-days: 30
          if-no-files-found: warn
