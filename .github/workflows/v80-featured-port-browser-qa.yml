name: V80 featured five cruise ports PC mobile photo QA
on:
  push:
    branches: [main]
    paths:
      - 'site/nf-v80-featured-ports.css'
      - 'scripts/v80_featured_port_browser_qa.py'
      - '.github/workflows/v80-featured-port-browser-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install chromium --with-deps
      - name: Validate real photos and responsive cards on live hub
        run: python scripts/v80_featured_port_browser_qa.py
      - name: Save hub screenshots at desktop and mobile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v80-five-port-real-browser
          path: audit-output/v80-featured-ports/
          if-no-files-found: warn
