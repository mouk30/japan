name: V39 verify 20 real-photo guide pages live
on:
  push:
    branches: [main]
    paths:
      - docs/v39-deployed-photo-credits.json
      - .github/workflows/v39-live-qa.yml
permissions:
  contents: write
jobs:
  live-verify-20:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Check 20 deployed WebP images, 20 pages and main directory
        id: check
        continue-on-error: true
        run: python scripts/v39_verify_live.py
      - name: Record real-production QA findings
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/v39-live-qa.json
          git diff --cached --quiet && exit 0
          git commit -m "V39 QA: verify 41 live WebP, guide and hub HTTP responses"
          git push
      - name: Block QA success on any missing image
        if: steps.check.outcome != 'success'
        run: exit 1
