name: V144 remaining shared original-photo provenance queue
on:
  push:
    branches: [main]
    paths:
      - scripts/v144_remaining_photo_queue.cjs
      - .github/workflows/v144-remaining-photo-queue.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/v144_remaining_photo_queue.cjs
      - name: Commit updated photo provenance candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit-reports/v144/remaining-photo-provenance-queue.json
          git diff --cached --quiet && exit 0
          git commit -m "audit(v144): prioritize remaining repeated stock-photo provenance candidates"
          git pull --rebase origin main
          git push origin HEAD:main
