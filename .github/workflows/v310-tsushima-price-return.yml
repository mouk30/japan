name: V310 original Tsushima price and wrong-booking-link correction QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'site/guide/busan-tsushima-ferry-price/index.html'
      - 'site/guide/tsushima-busan-ferry/index.html'
      - 'site/guide/busan-hitakatsu-ferry/index.html'
      - 'site/guide/busan-izuhara-ferry/index.html'
      - 'site/nf-v310-tsushima-facts.css'
      - 'scripts/qa_v310_tsushima_facts.py'
      - 'scripts/qa_v310_tsushima_browser.cjs'
      - '.github/workflows/v310-tsushima-price-return.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-price-booking-original-seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare original H1/meta/JSON-LD/photos and exact new operator paths
        run: |
          git fetch --quiet --depth=1 origin main:refs/remotes/origin/main
          python -m py_compile scripts/qa_v310_tsushima_facts.py
          python scripts/qa_v310_tsushima_facts.py
          python scripts/qa_v309_traveler_booking_return.py
          python scripts/qa_v305_third_party_booking_truth.py
          python scripts/qa_v296_intl_booking_cta.py
      - name: Block new HTML posts
        run: |
          if git diff --name-only --diff-filter=A origin/main...HEAD | grep -E '^site/.*\.html$'; then
            echo "No newly indexed articles allowed"
            exit 1
          fi
  browser-390-768-1440:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Twelve visual/interaction checks
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory site > /tmp/v310-http.log 2>&1 &
          for i in 1 2 3 4 5 6 7 8; do
            if curl -sf http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/qa_v310_tsushima_browser.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v310-12-source-pricing-and-return-screenshots
          path: audit-output/v310/
          retention-days: 7
          if-no-files-found: ignore
