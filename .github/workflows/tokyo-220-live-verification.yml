name: Tokyo 220 official links and public image checks
on:
  push:
    branches: [main]
    paths:
      - scripts/tokyo_220_live_verification.py
      - .github/workflows/tokyo-220-live-verification.yml
  workflow_dispatch:
  schedule:
    - cron: '40 4 * * 1'
permissions:
  contents: write
concurrency:
  group: tokyo-220-live-check
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check 220 articles' source URLs and public images
        run: python3 scripts/tokyo_220_live_verification.py
      - name: Persist evidence report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit-reports/tokyo-220-live-verification.json
          if ! git diff --cached --quiet; then
            git commit -m "Record Tokyo 220 public URLs and photo HTTP results"
            git pull --rebase origin main
            git push
          fi
