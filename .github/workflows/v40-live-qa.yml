name: V40 verify 20 real photos and article pages live
on:
  push:
    branches: [main]
    paths:
      - docs/v40-deployed-photo-credits.json
      - .github/workflows/v40-live-qa.yml
permissions:
  contents: write
jobs:
  live-verify-20:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Check 20 published WebP files 20 article URLs and directory
        id: check
        continue-on-error: true
        run: python scripts/v40_verify_live.py
      - name: Record all real deployment HTTP checks
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/v40-live-qa.json
          git diff --cached --quiet && exit 0
          git commit -m "V40 QA: 41 public site image and page status checks"
          git push
      - name: Require all production checks to pass
        if: steps.check.outcome != 'success'
        run: exit 1
