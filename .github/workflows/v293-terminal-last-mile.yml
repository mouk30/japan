name: V293 official terminal and last-mile QA
on:
  pull_request:
    paths:
      - 'site/booking/fukuoka/index.html'
      - 'site/booking/shimonoseki/index.html'
      - 'site/booking/osaka/index.html'
      - 'site/booking/tsushima/index.html'
      - 'scripts/qa_v293_terminal_last_mile.py'
      - '.github/workflows/v293-terminal-last-mile.yml'
  workflow_dispatch:
jobs:
  terminal-last-mile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/qa_v293_terminal_last_mile.py
