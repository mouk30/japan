name: NIPPONFERRY V270 Kobe Yokohama Hiroshima stay photo rights
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v270-stay-three-cities:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: V251-V254 KidsStay ferry image and region regression
        run: |
          node scripts/check-v251-stay-kids-boundary.mjs
          node scripts/check-v252-stay-ferry-clarity.mjs
          node scripts/check-v253-stay-images.mjs
          node scripts/check-v254-stay-local-verified.mjs
      - name: V270 static photo holds SEO and PR60 overlap QA
        run: node scripts/check-v270-stay-three-cities.mjs
      - name: Install Chromium for local render QA
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: V270 local Chromium 320 390 768 1440
        run: node scripts/browser-qa-v270-stay-three-cities.mjs
