name: V143 production section-depth and matched-image browser QA
on:
  push:
    branches: [main]
    paths:
      - scripts/v143_public_section_qa.py
      - .github/workflows/v143-public-depth-qa.yml
      - site/season/sapporo-snow-festival-2027/index.html
      - site/practical/japan-esim-vs-sim-wifi/index.html
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          python -m pip install playwright
          python -m playwright install chromium
      - name: Audit published guide details, source links and photo hashes
        run: |
          for attempt in 1 2 3; do
            if python scripts/v143_public_section_qa.py; then exit 0; fi
            echo "Public deployment or visual QA not complete yet ($attempt/3)"
            [ "$attempt" -lt 3 ] && sleep 20
          done
          exit 1
      - name: Archive screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v143-public-topic-guides-mobile-desktop
          path: audit-output/v143/
          retention-days: 40
          if-no-files-found: warn
