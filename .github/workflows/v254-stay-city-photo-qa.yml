name: NIPPONFERRY V254 verified regional stay photography
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v254-verified-stay-photo-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify old boundaries and old JPEG audit remain truthful
        run: |
          node scripts/check-v251-stay-kids-boundary.mjs
          node scripts/check-v252-stay-ferry-clarity.mjs
          node scripts/check-v253-stay-images.mjs
      - name: Verify photo bytes SHA, location, source credit and license
        run: node scripts/check-v254-stay-local-verified.mjs
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser check five regions at 320 / 390 / 768 / 1440px
        run: node scripts/browser-qa-v254-stay-photos.mjs
