name: V43 visually inspect 20 newly applied real photos
on:
  push:
    branches: [main]
    paths: [.github/workflows/v43-visual-contact.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - run: python scripts/v43_photo_contact.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github-actions[bot].github.com"
          git add docs/v43-photo-contact.b64
          git diff --cached --quiet && exit 0
          git commit -m "V43 QA: actual pixel contact sheet for 20 newly applied photographs"
          git pull --rebase origin main
          git push
