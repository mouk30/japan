name: V114 real landmark photographs source, SEO and PC mobile QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/things-to-do/*-cruise-port-day-trip/index.html'
      - 'audit-reports/v114/**'
      - 'scripts/v114_photo_quality_audit.py'
      - 'scripts/v114_photo_live_qa.py'
      - 'tests/test_v114_photo_quality_audit.py'
      - '.github/workflows/v114-photo-and-seo-qa.yml'
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Verify all ten photo hashes, original authors/licenses and SEO fields
        run: |
          python -m unittest discover -s tests -p 'test_v114_photo_quality_audit.py' -v
          python scripts/v114_photo_quality_audit.py
  production:
    runs-on: ubuntu-latest
    needs: source-audit
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install chromium --with-deps
      - name: Test all 10 production pages at 1440px and 390px
        run: |
          for attempt in 1 2 3; do
            if python scripts/v114_photo_live_qa.py; then exit 0; fi
            echo "CDN propagation or browser retry $attempt/3"
            if [ "$attempt" -lt 3 ]; then sleep 25; fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v114-ten-real-images-desktop-mobile-evidence
          path: audit-output/v114/
          retention-days: 45
