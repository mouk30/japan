name: V38 real-photo 20-article update
on:
  push:
    branches: [main]
    paths: [.github/workflows/v38-apply-photos.yml]
permissions:
  contents: write
jobs:
  prepare-20-verified-photographs:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install image conversion tools
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Verify Commons metadata, download 20 genuine photos and update pages
        run: python scripts/v38_apply_curated_photos.py
      - name: Validate 20 existing article pages and matching listing cards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          site=Path('site')
          rows=json.loads(Path('docs/v38-deployed-photo-credits.json').read_text(encoding='utf-8'))
          assert len(rows)==20,len(rows)
          hub=(site/'things-to-do/index.html').read_text(encoding='utf-8')
          sitemap=(site/'sitemap.xml').read_text(encoding='utf-8')
          slugs=set()
          for row in rows:
            slug=row['slug']; local=row['asset']; slugs.add(slug)
            imgfile=site/local.lstrip('/')
            with Image.open(imgfile) as image:
              assert image.format=='WEBP',slug
              assert min(image.size)>=350,slug
            page=(site/'things-to-do'/slug/'index.html').read_text(encoding='utf-8')
            assert f'src="{local}"' in page,slug
            assert f'src="{local}"' in hub,slug
            assert f'property="og:image" content="https://www.nipponferry.com{local}"' in page,slug
            assert f'name="twitter:image" content="https://www.nipponferry.com{local}"' in page,slug
            assert row['source_page'] in page,slug
            assert f'https://www.nipponferry.com/things-to-do/{slug}/' in sitemap,slug
          assert len(slugs)==20
          print('V38 verified 20/20 local WebP; 20/20 listing, hero, OG, Twitter, copyright, sitemap')
          PY
      - name: Commit 20 pictures and original content edits to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/images/culture-verified site/things-to-do docs/v38-deployed-photo-credits.json
          git diff --cached --quiet && exit 0
          git commit -m "V38: 20 licensed real-photo replacements for formerly graphic guide cards"
          git push
