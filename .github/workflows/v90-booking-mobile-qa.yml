name: V90 route booking mobile click and popup QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/guide/busan-osaka-ferry/index.html'
      - 'site/guide/busan-fukuoka-ferry/index.html'
      - 'site/guide/busan-shimonoseki-ferry/index.html'
      - 'site/guide/busan-tsushima-ferry/index.html'
      - 'site/nf-v90-booking-link-trust.css'
      - 'scripts/v90_booking_mobile_browser_qa.py'
      - '.github/workflows/v90-booking-mobile-qa.yml'
permissions:
  contents: read
jobs:
  real-production-booking-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install chromium --with-deps
      - name: Test official popup destinations, safe mobile targets and 18 live pages
        run: python scripts/v90_booking_mobile_browser_qa.py
      - name: Store real screenshots and clicked-provider popup metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v90-real-mobile-booking-click-qa
          path: audit-output/v90-booking-mobile/
          retention-days: 30
          if-no-files-found: warn
