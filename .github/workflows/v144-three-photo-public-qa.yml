name: V144 licensed real photo published browser QA
on:
  push:
    branches: [main]
    paths:
      - scripts/v144_three_photo_public_qa.py
      - .github/workflows/v144-three-photo-public-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright
          python -m playwright install chromium
      - name: Verify real public source-licensed photos and desktop/mobile display
        run: |
          for attempt in 1 2 3; do
            if python scripts/v144_three_photo_public_qa.py; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 25; fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v144-three-historic-real-photo-mobile-desktop-screenshots
          path: audit-output/v144-three-photos/
          retention-days: 35
          if-no-files-found: warn
