name: V43 final five documentary photo accuracy upgrades
on:
  push:
    branches: [main]
    paths: [.github/workflows/v43-final-precision.yml]
permissions:
  contents: write
jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - run: python scripts/v43_final_photo_precision.py
      - name: Assert source-linked captions and five new image SHA256 values
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          rows=json.loads(Path('docs/v43-deployed-photo-credits.json').read_text('utf-8'))
          fixes=json.loads(Path('docs/v43-photo-visual-corrections.json').read_text('utf-8'))
          assert len(rows)==20 and len(fixes['corrected'])==5
          for row in rows:
            img=Path('site')/row['asset'].lstrip('/')
            assert row['sha256']==hashlib.sha256(img.read_bytes()).hexdigest(),row['slug']
            text=(Path('site/things-to-do')/row['slug']/'index.html').read_text('utf-8')
            assert row['source_page'] in text,row['slug']
            assert '<meta name="twitter:image"' in text,row['slug']
          print('20 source photo hashes and page-credit links pass, 5 visual mismatches corrected')
          PY
      - name: Commit new real-photo selections and original source records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github-actions[bot].github.com"
          git add site/images/culture-verified site/things-to-do docs/v43-deployed-photo-credits.json docs/v36-hub-cards-audit.json docs/v43-photo-visual-corrections.json
          git diff --cached --quiet && exit 0
          git commit -m "V43 quality: brighten ryokan, show true kotatsu, colorful wagashi, lived-in izakaya and ramen"
          git pull --rebase origin main
          git push
