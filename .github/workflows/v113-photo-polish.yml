name: V113 visual correction for Ainu traditional house and Korean photo labels
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/v113_visual_photo_polish.py'
      - '.github/workflows/v113-photo-polish.yml'
permissions:
  contents: write
jobs:
  photo-polish:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "Pillow==11.3.0"
      - name: Confirm new Shiraoi site and polish ten real-photo captions
        run: python scripts/v113_visual_photo_polish.py
      - name: Commit reviewed Shiraoi real photo and caption correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/images/venues/nf-v113-shiraoi-real.webp site/things-to-do/*-cruise-port-day-trip/index.html audit-reports/v113/
          if ! git diff --cached --quiet; then
            git commit -m "V113 improve Shiraoi cultural hero and precise ten-photo credits"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
