name: Tokyo final official links and photo source audit
on:
  push:
    branches: [main]
    paths:
      - scripts/tokyo_final_link_photo_qa.py
      - .github/workflows/tokyo-final-links-photos.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/tokyo_final_link_photo_qa.py
      - name: Publish official link and photo audit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit-reports/tokyo-final-link-photo-qa.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish Tokyo official link HTTP and image provenance audit"
            git pull --rebase origin main
            git push
          fi
