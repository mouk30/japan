name: V169 public real Camellia not PanStar 390 768 1440 screen QA
on:
  push:
    branches: [main]
    paths:
      - "site/japan/fukuoka/index.html"
      - "site/busan-fukuoka-cruise/index.html"
      - "scripts/qa_v169_live_two_ship_cards.cjs"
      - ".github/workflows/v169-live-ship-photo-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-camellia-ship-photo-six-screens:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Screenshot 390, 768, 1440 and verify exact real Camellia ship
        run: |
          node --check scripts/qa_v169_live_two_ship_cards.cjs
          node scripts/qa_v169_live_two_ship_cards.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v169-six-public-new-camellia-photos-screenshots
          path: audit-output/v169-public/
          if-no-files-found: warn
