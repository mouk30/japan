name: V140 import licensed homepage region photographs
on:
  push:
    branches: [main]
    paths:
      - scripts/v140_import_home_photos.py
      - .github/workflows/v140-home-photos.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v140-home-photos
  cancel-in-progress: false
jobs:
  verify-and-import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Download and convert documented Commons photographs
        run: python scripts/v140_import_home_photos.py
      - name: Validate site source and image assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json,re
          p=Path('site/index.html').read_text('utf8')
          r=json.loads(Path('audit-reports/v140/import-report.json').read_text('utf8'))
          assert r['total_home_cards_changed']==5
          assert p.count('class="v140-credit"')==1
          for x in r['source_photos']:
              f=Path('site')/x['dest'].lstrip('/')
              with Image.open(f) as im: assert im.format=='WEBP' and im.width>=750
              assert p.count('src="'+x['dest']+'"')==1
          assert 'nf-v137-mobile-readability.css' in p
          assert 'nf-v138-mobile-polish.css' in p
          print('V140 verified photos and SEO-safe images: 5 homepage cards')
          PY
      - name: Commit verified files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html site/images/venues/nf-v140-* audit-reports/v140/import-report.json
          git diff --cached --quiet && exit 0
          git commit -m "V140: replace 3 more regional homepage cards with licensed documentary photos"
          git pull --rebase origin main
          git push origin HEAD:main
