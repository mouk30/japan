name: V131 five cruise ports berth-shuttle-return-booking official and browser QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/things-to-do/naha-cruise-terminal-kokusai-dori/index.html'
      - 'site/things-to-do/ishigaki-cruise-kabira-bay-bus-taxi/index.html'
      - 'site/things-to-do/hakata-port-hakata-station-access/index.html'
      - 'site/things-to-do/nagasaki-matsugae-glover-garden-cruise-access/index.html'
      - 'site/things-to-do/yokohama-red-brick-warehouse/index.html'
      - 'scripts/v131_five_ports_official_qa.py'
      - '.github/workflows/v131-five-cruise-ports-official-qa.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify all five existing articles, official source links, conditional berth and return information and SEO
        run: python scripts/v131_five_ports_official_qa.py
  public:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install chromium --with-deps
      - name: Verify five public pages on desktop and mobile with all evidence cards and official links
        run: |
          for attempt in 1 2 3 4 5; do
            if python scripts/v131_five_ports_official_qa.py --live; then exit 0; fi
            echo "Public CDN propagation check: attempt $attempt/5"
            if [ "$attempt" -lt 5 ]; then sleep 30; fi
          done
          exit 1
      - name: Recheck two official links without mistaking 503 and bot blocks for deleted pages
        run: python scripts/v131_five_ports_official_qa.py --links
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v131-five-ports-official-berth-shuttle-return-qa-10-screenshots
          path: audit-output/v131/
          retention-days: 45
