name: V69 published cruise port content verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v69-live-production-qa.yml'
      - 'scripts/v69_live_production.mjs'
permissions:
  contents: write
jobs:
  verify-published-cruise-guides:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Confirm production pages publish new official guidance and logo size guard
        id: live
        continue-on-error: true
        run: node scripts/v69_live_production.mjs
      - name: Archive live inspection results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v69-20-live-production-ports
          path: audit-reports/v69/live-production.json
          retention-days: 21
          if-no-files-found: warn
      - name: Save live production audit
        if: always()
        run: |
          if [ ! -f audit-reports/v69/live-production.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit-reports/v69/live-production.json
          git diff --cached --quiet && exit 0
          git commit -m "V69: archive real published HTML test for twenty cruise port guides"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fail if production is stale
        if: steps.live.outcome != 'success'
        run: exit 1
