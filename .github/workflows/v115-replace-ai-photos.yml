name: V115 ten real landmark photos import and SEO preservation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/v115_replace_ai_heroes.py'
      - 'audit-reports/v115/photo-plan.json'
      - '.github/workflows/v115-replace-ai-photos.yml'
permissions:
  contents: write
concurrency:
  group: v115-photo-import
  cancel-in-progress: false
jobs:
  import-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reproducible WebP conversion
        run: python -m pip install "Pillow==11.3.0"
      - name: Require all ten Commons photographs and unchanged original SEO
        run: python scripts/v115_replace_ai_heroes.py
      - name: Verify ten WebPs and legacy SEO before publishing
        run: python scripts/v115_photo_quality_audit.py
      - name: Commit ten new WebPs and existing articles atomically
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/images/venues/nf-v115-*-real.webp audit-reports/v115/import-result.json site/things-to-do/*-cruise-port-day-trip/index.html
          if git diff --cached --quiet; then
            echo "No actual photo changes staged"; exit 1
          fi
          git commit -m "V115 replace ten AI port heroes with licensed real WebPs and preserve original SEO"
          git pull --rebase origin main
          python scripts/v115_photo_quality_audit.py
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v115-licensed-original-photo-import-evidence
          path: audit-reports/v115/import-result.json
          retention-days: 45
