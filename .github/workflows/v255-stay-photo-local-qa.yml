name: NIPPONFERRY V255 stay photo location license and responsive QA
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v255-three-existing-stay-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve existing KidsStay boundary, ferry booking clarity and V253 audit
        run: |
          node scripts/check-v251-stay-kids-boundary.mjs
          node scripts/check-v252-stay-ferry-clarity.mjs
          node scripts/check-v253-stay-images.mjs
      - name: Verify 3 place-photo source blobs, rights, captions, SEO and 28 page count
        run: node scripts/check-v255-stay-three-region-photos.mjs
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser QA at 320 390 768 and 1440px
        run: node scripts/browser-qa-v255-stay-three-regions.mjs
