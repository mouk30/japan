name: V66 Premium homepage responsive link SEO QA
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v66-home-premium-qa.yml
      - scripts/v66_home_browser_qa.mjs
      - site/index.html
permissions:
  contents: write
jobs:
  audit-home:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Audit V63 through V66, all links and four breakpoints
        id: browserqa
        continue-on-error: true
        run: |
          python3 -m http.server 8757 --directory site --bind 127.0.0.1 >/tmp/v66-http.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID || true" EXIT
          sleep 2
          node scripts/v66_home_browser_qa.mjs
      - name: Upload 16 responsive screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v66-home-premium-four-size-qa
          path: audit-reports/v66/
          retention-days: 21
          if-no-files-found: warn
      - name: Commit successful report
        if: steps.browserqa.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit-reports/v66/report.json
          git diff --cached --quiet && exit 0
          git commit -m "V66: record 16 viewport passes plus SEO and internal href audit"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Reject visual or missing-link regressions
        if: steps.browserqa.outcome != 'success'
        run: exit 1
