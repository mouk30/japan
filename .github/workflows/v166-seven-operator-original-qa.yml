name: V166 seven existing operator notices and cruise return QA
on:
  push:
    branches: [main]
    paths:
      - "site/things-to-do/wakkanai-cruise-port-day-trip/index.html"
      - "site/things-to-do/rishiri-kutsugata-cruise-port-day-trip/index.html"
      - "site/things-to-do/iki-gonoura-cruise-port-day-trip/index.html"
      - "site/things-to-do/tsushima-izuhara-cruise-port-day-trip/index.html"
      - "site/things-to-do/hakodate-cruise-port-day-trip/index.html"
      - "site/things-to-do/aomori-cruise-port-day-trip/index.html"
      - "site/things-to-do/niigata-cruise-port-day-trip/index.html"
      - "scripts/qa_v166_seven_booking_return.py"
      - ".github/workflows/v166-seven-operator-original-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-original-images-seo-operator-booking-last-return:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Seven official operator and original protected metadata checks
        run: |
          python -m py_compile scripts/qa_v166_seven_booking_return.py
          python scripts/qa_v166_seven_booking_return.py
      - name: Site build regression
        run: node build.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v166-seven-existing-original-photo-seo-booking-qa
          path: audit-output/v166/
          if-no-files-found: warn
