name: Family Cards Verified Photo Backfill
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/family-photo-backfill.py'
      - '.github/workflows/family-photo-backfill.yml'
permissions:
  contents: write
jobs:
  verified-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Fetch rights-reviewed exact venue photos and validate all 45 cards
        run: python scripts/family-photo-backfill.py
      - name: Publish only actually downloaded WebP photos and matched pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/images/venues site/things-to-do audit-reports/
          if ! git diff --cached --quiet; then
            git commit -m "Quality audit: backfill licensed venue WebP thumbnails"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload thumbnail inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-photo-45-card-inventory
          path: audit-reports/family-thumbnails.json
          retention-days: 30
