name: V169 real New Camellia photo correct subject and SEO source QA
on:
  push:
    branches: [main]
    paths:
      - "site/japan/fukuoka/index.html"
      - "site/busan-fukuoka-cruise/index.html"
      - "scripts/qa_v169_correct_camelia_photo.py"
      - ".github/workflows/v169-camellia-source-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-SEO-and-authentic-ship-photo:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check New Camellia identity and CC BY attribution against pre-change SEO
        run: |
          python -m py_compile scripts/qa_v169_correct_camelia_photo.py
          python scripts/qa_v169_correct_camelia_photo.py
      - name: Existing site build regression
        run: node build.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v169-new-camellia-real-photo-original-seo
          path: audit-output/v169/
          if-no-files-found: warn
