name: V30 Sitewide Image Relevance Scan
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit-v30-sitewide-images.py'
      - '.github/workflows/v30-sitewide-images-qa.yml'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Scan every static HTML page and linked local photo
        run: python3 scripts/audit-v30-sitewide-images.py
      - name: Upload categorized audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v30-sitewide-image-content-scan
          path: audit-reports/v30/sitewide-scan.json
          retention-days: 30
