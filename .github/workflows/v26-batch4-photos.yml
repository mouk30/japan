name: V26 Batch 4 Licensed Photo Replacement
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/v26-batch4-real-photos.py'
      - '.github/workflows/v26-batch4-photos.yml'
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==11.3.0
      - name: Fetch Commons source photos, create WebP and attribute
        run: python scripts/v26-batch4-real-photos.py
      - name: Check resulting photos
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('audit-reports/v26/batch4.json').read_text())
          assert len(report)==5
          for p in report:
              assert p['bytes']>10000 and p['width']>=700
              h=Path('site/things-to-do/'+p['slug']+'-cruise-port-day-trip/index.html').read_text()
              assert p['image'] in h and p['author'] in h and p['source'] in h
          print('V26_BATCH4_VALIDATED 5/5')
          PY
      - name: Commit to main once
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/images/venues/*-v26-real-location.webp site/things-to-do/{akita,kochi,matsuyama,maizuru,kumamoto}-cruise-port-day-trip/index.html audit-reports/v26/batch4.json
          git diff --cached --check
          git commit -m "V26 batch4: five licensed real attraction photos, sources and OG images"
          git push
