name: V36 food visual asset catalog
on:
  push:
    branches: [main]
    paths: [.github/workflows/v36-food-asset-catalog.yml]
permissions:
  contents: write
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('site/images')
          patterns=['food','ramen','takoyaki','yatai','matcha','wagashi','soba','udon','market','sushi','tsushima','fukuoka','osaka','shimonoseki','motsunabe','fugu','cafe','sweet','dessert','seafood','izakaya','mochi','rice','bento','tempura','fish','kawara','cake','curry']
          photos=sorted(str(p.relative_to('site')) for p in root.rglob('*') if p.is_file() and p.suffix.lower() in ('.jpg','.png','.webp') and any(s in str(p).lower() for s in patterns))
          Path('docs/v36-food-image-inventory.txt').write_text('\n'.join(photos),encoding='utf-8')
          print('FOOD ASSETS',len(photos))
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/v36-food-image-inventory.txt
          git diff --cached --quiet && exit 0
          git commit -m "V36: inventory food-related photo assets for image correction"
          git push
