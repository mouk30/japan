name: V37 verify live deployed thumbnails and WebP files
on:
  push:
    branches: [main]
    paths: [.github/workflows/v37-live-qa.yml]
permissions:
  contents: write
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Check deployed HTML references and actual WebP HTTP responses
        id: audit
        continue-on-error: true
        run: python scripts/v37_verify_live.py
      - name: Commit live HTTP report whether passed or failed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/v37-live-qa.json
          git diff --cached --quiet && exit 0
          git commit -m "V37 QA: report live production photo URL status"
          git push
      - name: Fail job if live check failed
        if: steps.audit.outcome != 'success'
        run: exit 1
