name: V357 Return Check-in Inventory
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/audit-v357-return-checkin.mjs'
      - '.github/workflows/v357-return-checkin.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  return-checkin-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/audit-v357-return-checkin.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: v357-return-checkin-review
          path: audit-reports/v357/
          retention-days: 30
