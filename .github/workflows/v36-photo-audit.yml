name: V36 inspect existing imagery
on:
  push:
    branches: [main]
    paths: [.github/workflows/v36-photo-audit.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python scripts/v36_photo_audit.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/v36-photo-audit.json
          git diff --cached --quiet && exit 0
          git commit -m "V36 audit: inventory article image references"
          git push
