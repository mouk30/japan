name: V133 live public 4 content photo and official source PC/mobile QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/v133_public_qa.py'
      - 'site/things-to-do/okinawa-shuri-castle/index.html'
      - 'site/things-to-do/naha-shuri-castle-cruise-sightseeing/index.html'
      - 'site/things-to-do/nanao-cruise-port-day-trip/index.html'
      - 'site/things-to-do/nagasaki-cruise-port-day-trip/index.html'
      - '.github/workflows/v133-live-official-photo-qa.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install chromium --with-deps
      - name: Check four existing revised pages on two viewports with live image decode, accurate source and official condition panel
        run: |
          for attempt in 1 2 3; do
            if python scripts/v133_public_qa.py; then exit 0; fi
            echo "Public deployment check $attempt of 3"
            if [ "$attempt" -lt 3 ]; then sleep 30; fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v133-four-verified-photo-official-conditions-pages-8-screenshots
          path: audit-output/v133/
          retention-days: 45
