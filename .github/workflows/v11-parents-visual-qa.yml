name: V11 Parents 15 Mobile Desktop Live QA
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit-parents-v11.mjs'
      - '.github/workflows/v11-parents-visual-qa.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build deployment output
        run: npm run build
      - name: Check 15 parent guides on preview and live production
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist > /tmp/parents-v11-preview.log 2>&1 &
          sleep 2
          node scripts/audit-parents-v11.mjs
        env:
          LOCAL_BASE_URL: http://127.0.0.1:8765
          LIVE_BASE_URL: https://www.nipponferry.com
      - name: Save screenshots and CSV/JSON quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v11-parents-15-visual-qa
          path: audit-reports/parents-visual-v11/
          retention-days: 30
