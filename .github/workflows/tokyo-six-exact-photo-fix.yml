name: Tokyo six exact-source photo fixes
on:
  push:
    branches: [main]
    paths:
      - scripts/tokyo_six_exact_source_fix.py
      - .github/workflows/tokyo-six-exact-photo-fix.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python scripts/tokyo_six_exact_source_fix.py
      - name: Publish corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/images/tokyo-verified site/tokyo-card-photos.js site/japan/tokyo audit-reports/tokyo-six-exact-source-photo-fix.json
          if ! git diff --cached --quiet; then
            git commit -m "Replace misleading Tokyo shopping and Disney thumbnails with accurately sourced originals"
            git pull --rebase origin main
            git push
          fi
