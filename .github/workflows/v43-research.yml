name: V43 verify 20 formerly uncredited editorial image sources
on:
  push:
    branches: [main]
    paths: [.github/workflows/v43-research.yml]
permissions:
  contents: write
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python scripts/v43_commons_research.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/v43-commons-research.json
          git diff --cached --quiet && exit 0
          git commit -m "V43: research 20 photo subjects and licenses"
          git pull --rebase origin main
          git push
