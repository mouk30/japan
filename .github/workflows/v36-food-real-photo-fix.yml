name: V36.2 replace food city photo mismatches
on:
  push:
    branches: [main]
    paths: [.github/workflows/v36-food-real-photo-fix.yml]
permissions:
  contents: write
jobs:
  correct-nine-verified-food-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install image conversion
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Fetch and convert verified originals
        run: python scripts/v36_food_photo_correction.py
      - name: Confirm local WebP files and exact card connections
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          site=Path('site')
          records=json.loads(Path('docs/v36-food-photo-provenance.json').read_text('utf-8'))
          assert len(records)==16
          assert sum(bool(r.get('license')) for r in records)==9
          hub=(site/'food/index.html').read_text('utf-8')
          assert hub.count('class="dircard"')==16
          assert hub.count('id="v36-food-source-index"')==1
          for r in records:
            p=site/r['image'].lstrip('/')
            assert p.exists(),p
            assert f'src="{r["image"]}"' in hub
            article=(site/'japan'/f'{r["city"]}-{r["type"]}'/'index.html').read_text('utf-8')
            assert f'src="{r["image"]}"' in article
            assert 'v36-photo-credit' in article
          print("V36.2 OK: 9 provenanced photos, 16 matching cards and covers")
          PY
      - name: Commit corrected photos and pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/food/index.html site/japan site/images/food-verified docs/v36-food-photo-provenance.json
          git diff --cached --quiet && exit 0
          git commit -m "V36.2: nine verified cuisine photographs and 16 matched food cards"
          git push
