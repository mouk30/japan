name: V81 four Japan destination photo card QA
on:
  push:
    branches: [main]
    paths:
      - 'site/nf-v81-destination-hub.css'
      - 'scripts/v81_destination_hub_browser_qa.py'
      - '.github/workflows/v81-destination-hub-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install chromium --with-deps
      - name: Inspect 4 destination cards on published website PC and mobile
        run: python scripts/v81_destination_hub_browser_qa.py
      - name: Upload 8 individual photo cards and full section screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v81-four-japan-destinations-pc-mobile
          path: audit-output/v81-destination-hub/
          if-no-files-found: warn
