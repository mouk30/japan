name: V287 approved PanStar full-ship hero gate
on:
  pull_request:
    paths:
      - 'site/booking/**'
      - 'site/japan-cruise/**'
      - 'site/images/panstar-cruise-clean-2048.webp'
      - 'scripts/qa_v287_panstar_hero_gate.py'
      - '.github/workflows/v287-panstar-hero.yml'
  workflow_dispatch:
jobs:
  approved-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/qa_v287_panstar_hero_gate.py
