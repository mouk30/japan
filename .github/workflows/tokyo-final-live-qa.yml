name: Tokyo final 220 live browser QA
on:
  push:
    branches: [main]
    paths:
      - scripts/tokyo_220_live_page_qa.py
      - .github/workflows/tokyo-final-live-qa.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/tokyo_220_live_page_qa.py
      - name: Publish browser and visual QA evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit-reports/tokyo-final-live-qa
          if ! git diff --cached --quiet; then
            git commit -m "Publish final 220 Tokyo live browser QA evidence"
            git pull --rebase origin main
            git push
          fi
