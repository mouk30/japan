name: V68 verified photo replacement
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v68-verified-photo-replacement.yml'
      - 'scripts/v68_verified_photo_replacement.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Download, verify and replace four source-backed images
        run: python scripts/v68_verified_photo_replacement.py
      - name: Verify updated photos and canonical tags
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          data=json.loads(Path("audit-reports/v68/verified-photo-sources.json").read_text())
          for x in data:
            p=Path("site/things-to-do")/x["slug"]/"index.html"
            c=p.read_text()
            assert x["webp"] in c and "nf-v68-photo-attribution" in c
            assert 'href="/favicon.svg"' in c
            assert "https://www.nipponferry.com/things-to-do/"+x["slug"]+"/" in c
            assert (Path("site")/x["webp"].lstrip("/")).exists()
          print("4/4 source-backed images and SEO preserved")
          PY
      - name: Commit only verified images and matching article updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/images/v68-verified/ site/things-to-do/ audit-reports/v68/
          git diff --cached --quiet || (git commit -m "V68 replace four AI visuals with sourced real-location WebP photos" && git push)
