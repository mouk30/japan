name: V161 public six Izu cruise ports photos sitemap HTTP QA
on:
  push:
    branches: [main]
    paths:
      - "site/things-to-do/tokyo-cruise-port-day-trip/index.html"
      - "site/things-to-do/okata-izu-oshima-cruise-port-day-trip/index.html"
      - "site/things-to-do/niijima-cruise-port-day-trip/index.html"
      - "site/things-to-do/kozushima-cruise-port-day-trip/index.html"
      - "site/things-to-do/miike-miyakejima-cruise-port-day-trip/index.html"
      - "site/things-to-do/kaminato-hachijojima-cruise-port-day-trip/index.html"
      - "scripts/qa_v161_live_six_island_ports.py"
      - ".github/workflows/v161-live-six-ports.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-verified-original-ports-photos-sitemap:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify real site HTML source photos and sitemap
        run: |
          python -m py_compile scripts/qa_v161_live_six_island_ports.py
          python scripts/qa_v161_live_six_island_ports.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v161-real-public-cruise-six-photo-sitemap
          path: audit-output/v161-public/
          if-no-files-found: warn
