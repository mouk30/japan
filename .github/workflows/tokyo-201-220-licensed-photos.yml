name: Tokyo 201-220 family, cruise and seasonal photos
on:
  push:
    branches: [main]
    paths:
      - scripts/tokyo_201_220_licensed_photos.py
      - .github/workflows/tokyo-201-220-licensed-photos.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python scripts/tokyo_201_220_licensed_photos.py
      - name: Commit licensed travel photographs and credits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/images/tokyo-verified site/tokyo-card-photos.js audit-reports/tokyo-201-220-photographic-replacement.json
          if ! git diff --cached --quiet; then
            git commit -m "Upgrade Tokyo V201-220 family and cruise cards with licensed photographs"
            git pull --rebase origin main
            git push
          fi
