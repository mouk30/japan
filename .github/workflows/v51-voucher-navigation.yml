name: V51 link voucher category in all site navigation
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v51-voucher-navigation.yml
permissions:
  contents: write
jobs:
  integrate-voucher:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Add accessible voucher nav to all HTML templates
        run: python scripts/v51_link_voucher_navigation.py
      - name: Validate source and site map
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('site')
          d=json.loads(Path('docs/v51-voucher-navigation-audit.json').read_text('utf-8'))['summary']
          assert d['desktop_links_added']>5
          assert d['unlinked_desktop_headers']==0 and d['unlinked_mobile_headers']==0
          assert (root/'voucher/index.html').is_file()
          assert 'https://www.nipponferry.com/voucher/' in (root/'sitemap.xml').read_text('utf-8')
          print(f"PASS voucher navigation in {d['updated_pages']} additional pages")
          PY
      - name: Publish audited navigation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site docs/v51-voucher-navigation-audit.json
          git diff --cached --quiet && exit 0
          git commit -m "V51: add voucher navigation across the Japan travel site"
          git pull --rebase origin main
          git push
