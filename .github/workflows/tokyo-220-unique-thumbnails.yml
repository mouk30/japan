name: Tokyo 220 complete unique thumbnails
on:
  push:
    branches: [main]
    paths:
      - scripts/tokyo_220_unique_thumbnails.py
      - .github/workflows/tokyo-220-unique-thumbnails.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate 220 distinct images and connect cards
        run: python3 scripts/tokyo_220_unique_thumbnails.py
      - name: Commit topic illustrations and mappings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/images/tokyo-topics site/tokyo-card-photos.js site/tokyo-guide.css audit-reports/tokyo-220-images-built.json
          if ! git diff --cached --quiet; then
            git commit -m "Complete all 220 Tokyo card visuals with unique themed images"
            git pull --rebase origin main
            git push
          fi
