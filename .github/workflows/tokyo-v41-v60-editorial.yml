name: Tokyo V41-V60 station editorial upgrade
on:
  push:
    branches: [main]
    paths:
      - scripts/tokyo_v41_v60_editorial_upgrade.py
      - .github/workflows/tokyo-v41-v60-editorial.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/tokyo_v41_v60_editorial_upgrade.py
      - name: Commit station information revisions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/japan/tokyo audit-reports/tokyo-v41-v60-editorial-upgrade.json
          if ! git diff --cached --quiet; then
            git commit -m "Improve Tokyo V41-V60 station exit and transfer guidance"
            git pull --rebase origin main
            git push
          fi
