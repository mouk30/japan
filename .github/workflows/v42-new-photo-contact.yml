name: V42 visually review 11 installed original photos
on:
  push:
    branches: [main]
    paths: [.github/workflows/v42-new-photo-contact.yml]
permissions:
  contents: write
jobs:
  visual-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - run: python scripts/v42_new_photo_contact.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/v42-image-audit/new-photo-contact.b64
          git diff --cached --quiet && exit 0
          git commit -m "V42: visual QA sheet for 11 newly installed verified photos"
          git pull --rebase origin main
          git push
