name: V292 Hakata and Shimonoseki return check-in QA
on:
  pull_request:
    paths:
      - 'site/booking/fukuoka/index.html'
      - 'site/booking/shimonoseki/index.html'
      - 'scripts/qa_v292_hakata_shimonoseki_return.py'
      - '.github/workflows/v292-return-checkin.yml'
  workflow_dispatch:
jobs:
  return-checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/qa_v292_hakata_shimonoseki_return.py
