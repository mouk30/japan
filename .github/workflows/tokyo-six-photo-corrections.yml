name: Correct 6 mismatched Tokyo photographs
on:
  push:
    branches: [main]
    paths:
      - scripts/tokyo_six_photo_corrections.py
      - .github/workflows/tokyo-six-photo-corrections.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python scripts/tokyo_six_photo_corrections.py
      - name: Save corrected photos and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/images/tokyo-verified site/tokyo-card-photos.js site/japan/tokyo audit-reports/tokyo-six-photo-corrections.json
          if ! git diff --cached --quiet; then
            git commit -m "Correct Tokyo Disney and Daimaru misleading photographs"
            git pull --rebase origin main
            git push
          fi
