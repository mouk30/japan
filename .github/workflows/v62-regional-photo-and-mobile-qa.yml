name: V62 real regional location photos and 4-breakpoint browser QA
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v62-regional-photo-and-mobile-qa.yml
      - scripts/v62_import_regional_photos.py
      - scripts/v62_responsive_qa.mjs
permissions:
  contents: write
jobs:
  publish-real-photography-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image converter
        run: python -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
      - name: Download licensed location photos and publish corrected page references
        run: python scripts/v62_import_regional_photos.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Render and test 5 pages at 320 / 390 / 768 / 1440px
        id: browserqa
        continue-on-error: true
        run: |
          python3 -m http.server 8757 --directory site --bind 127.0.0.1 >/tmp/v62-http.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID || true" EXIT
          sleep 2
          node scripts/v62_responsive_qa.mjs
      - name: Upload browser screenshots and structured QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v62-real-regional-photos-mobile-audit
          path: audit-reports/v62/
          retention-days: 21
          if-no-files-found: warn
      - name: Commit source-attributed WebP assets, travel pages, and results
        if: steps.browserqa.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/images/venues/v62-karato-market-real.webp site/images/venues/v62-izuhara-port-real.webp
          git add site/index.html site/things-to-do/shimonoseki-one-day/index.html site/things-to-do/tsushima-one-day/index.html
          git add docs/v62-regional-real-photo-sources.json audit-reports/v62/responsive-qa.json
          git diff --cached --quiet && exit 0
          git commit -m "V62: publish actual Karato and Izuhara WebP photos; pass 20 browser viewport checks"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fail on layout, image, or internal link regression
        if: steps.browserqa.outcome != 'success'
        run: exit 1
