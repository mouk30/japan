name: V144 verified historic place-photo import
on:
  push:
    branches: [main]
    paths:
      - scripts/v144_import_three_licensed_photos.py
      - .github/workflows/v144-real-photo-import.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v144-historic-photo-import
  cancel-in-progress: false
jobs:
  licensed-photo-import:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Import source-verified historical festival and railway photos
        run: python scripts/v144_import_three_licensed_photos.py
      - name: Verify each photo/credit and immutable SEO
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          d=json.loads(Path("audit-reports/v144/editorial-image-provenance-report.json").read_text("utf8"))
          photos=d["verified_documentary_photo_additions"]
          assert len(photos)==3
          assert d["images_replaced_with_diagrams"]==51
          for x in photos:
            h=(Path("site")/x["page"].lstrip("/")/"index.html").read_text("utf8")
            f=Path("site")/x["image"].lstrip("/")
            assert f.exists(),str(f)
            assert hashlib.sha256(f.read_bytes()).hexdigest()==x["sha256"]
            assert h.count('src="'+x["image"]+'"')==1
            assert h.count('href="'+x["source"]+'"')==1
            assert h.count('href="'+x["license_url"]+'"')>=1
            assert x["author"] in h and x["capture_date"] in h
            assert 'v144-topic-visual' in h
            assert '<link rel="canonical" href="https://www.nipponferry.com'+x["page"]+'"' in h
          print("V144 THREE ORIGINAL LICENSED PHOTO SOURCES AND ORIGINAL PAGE SEO PASS")
          PY
      - name: Preserve website inventory and production build
        run: |
          npm run build
          node scripts/v143_contextual_link_audit.cjs
      - name: Commit licensed real images and final source records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/season/asahikawa-winter-festival/index.html site/season/otaru-snow-light-path-2027/index.html site/practical/kyoto-tango-kuromatsu/index.html site/images/venues/nf-v144-* audit-reports/v144/editorial-image-provenance-report.json
          git diff --cached --quiet && exit 0
          git commit -m "V144 add three credited historic location-matched photographs to guides"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v144-three-licensed-original-photos
          path: audit-reports/v144/editorial-image-provenance-report.json
          retention-days: 35
          if-no-files-found: warn
