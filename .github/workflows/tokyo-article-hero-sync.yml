name: Tokyo article body hero photo repair
on:
  push:
    branches: [main]
    paths:
      - scripts/tokyo_220_article_hero_sync.py
      - .github/workflows/tokyo-article-hero-sync.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/tokyo_220_article_hero_sync.py
      - name: Commit article image repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/japan/tokyo audit-reports/tokyo-article-hero-sync.json
          if ! git diff --cached --quiet; then
            git commit -m "Replace old Tokyo article SVG images with licensed WebP photos"
            git pull --rebase origin main
            git push
          fi
