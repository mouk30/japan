name: Tokyo V81-V100 Disney editorial upgrade
on:
  push:
    branches: [main]
    paths:
      - scripts/tokyo_v81_v100_editorial_upgrade.py
      - .github/workflows/tokyo-v81-v100-editorial.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/tokyo_v81_v100_editorial_upgrade.py
      - name: Commit Disney editorial improvements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/japan/tokyo audit-reports/tokyo-v81-v100-editorial-upgrade.json
          if ! git diff --cached --quiet; then
            git commit -m "Clarify Tokyo Disney V81-V100 tickets, passes and hotels"
            git pull --rebase origin main
            git push
          fi
