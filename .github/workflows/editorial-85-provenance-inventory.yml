name: Audit provenance of 85 editorial guide images
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/editorial-85-provenance-inventory.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/audit_editorial_85_image_sources.py
      - name: Commit evidence inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit-reports/editorial-85/
          if ! git diff --cached --quiet; then
            git commit -m "Document photo provenance status for 85 editorial guides"
            git push
          fi
