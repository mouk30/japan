name: Tokyo V121-V140 floor guide editorial
on:
  push:
    branches: [main]
    paths:
      - scripts/tokyo_v121_v140_editorial_upgrade.py
      - .github/workflows/tokyo-v121-v140-editorial.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/tokyo_v121_v140_editorial_upgrade.py
      - name: Commit floor-specific guidance and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/japan/tokyo audit-reports/tokyo-v121-v140-editorial-upgrade.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Tokyo V121-V140 shopping floor guides"
            git pull --rebase origin main
            git push
          fi
