name: V10 Publish Verified Local WebP Photos
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/v10-publish-verified-photos.py'
      - '.github/workflows/v10-publish-verified-photos.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Download and convert licensed photographs
        run: python scripts/v10-publish-verified-photos.py
      - name: Publish local venue photos and updated guides
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/images/venues site/things-to-do
          if ! git diff --cached --quiet; then
            git commit -m "V10: publish verified local venue WebP assets"
            git push
          fi
