name: V142 global navigation focus and current-category browser QA
on:
  push:
    branches: [main]
    paths:
      - site/v301-nav.css
      - site/v301-nav.js
      - scripts/v142_nav_accessibility_qa.py
      - .github/workflows/v142-nav-accessibility-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser QA
        run: |
          python -m pip install playwright
          python -m playwright install chromium
      - name: Build all site pages preserving SEO
        run: npm run build
      - name: Run full 36-screen menu accessibility tests
        run: |
          python3 -m http.server 8782 --directory dist --bind 127.0.0.1 >/tmp/v142-http.log 2>&1 &
          PID=$!
          trap "kill $PID || true" EXIT
          sleep 2
          python scripts/v142_nav_accessibility_qa.py
      - name: Save real screenshot and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v142-navigation-focus-mobile-active-state
          path: audit-output/v142/
          retention-days: 35
          if-no-files-found: warn
