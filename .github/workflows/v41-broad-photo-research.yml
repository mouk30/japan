name: V41 broaden exact photographed subject search
on:
  push:
    branches: [main]
    paths: [.github/workflows/v41-broad-photo-research.yml]
permissions:
  contents: write
jobs:
  broad:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python scripts/v41_broad_research.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/v41-broad-commons-research.json
          git diff --cached --quiet && exit 0
          git commit -m "V41 source: broaden verified photo candidate search"
          git pull --rebase origin main
          git push
