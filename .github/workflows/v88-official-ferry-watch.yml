name: V88 official ferry notice and stale fare monitor
on:
  workflow_dispatch:
  schedule:
    # UTC: around 10:13 and 22:13 Korea time (Actions queue may delay).
    - cron: '13 1,13 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/v88_official_watch.py'
      - 'scripts/v88_official_baseline.json'
      - 'tests/test_v88_official_watch.py'
      - '.github/workflows/v88-official-ferry-watch.yml'
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: v88-official-ferry-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source parsing dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Run offline notice and fare parser regression tests
        run: python -m unittest discover -s tests -p 'test_v88_official_watch.py' -v
      - name: Restore most recent source-review snapshot for in-place edit detection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p audit-reports/v88/previous
          for prior in $(gh run list -R "$GITHUB_REPOSITORY" --workflow v88-official-ferry-watch.yml --status success --limit 8 --json databaseId --jq '.[].databaseId'); do
            if [ "$prior" = "$GITHUB_RUN_ID" ]; then continue; fi
            if gh run download "$prior" -R "$GITHUB_REPOSITORY" --name v88-official-notice-and-stale-fare-report --dir audit-reports/v88/previous 2>/dev/null; then
              echo "Using previous normalized snapshot from run $prior"
              break
            fi
          done
      - name: Scan official sources and existing ferry pages (read-only)
        id: inspect
        run: python scripts/v88_official_watch.py
      - name: Archive source monitoring report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v88-official-notice-and-stale-fare-report
          path: audit-reports/v88/current/
          retention-days: 90
          if-no-files-found: warn
      - name: Write Actions overview
        if: always()
        run: |
          if [ -f audit-reports/v88/current/summary.md ]; then
            cat audit-reports/v88/current/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Open or update human-review issue only when attention is needed
        if: steps.inspect.outputs.attention == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FINGERPRINT: ${{ steps.inspect.outputs.fingerprint }}
        run: |
          TITLE='V88 official ferry fares and sailings — manual review'
          SUMMARY="audit-reports/v88/current/summary.md"
          {
            printf 'V88 fingerprint: %s\n\n' "$FINGERPRINT"
            cat "$SUMMARY"
            printf '\n\nRun: https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'Only human-verified route/date-specific changes should be published. Fetch failures are not confirmed price changes.\n'
          } > /tmp/v88_issue.txt
          EXISTING=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title --jq '.[] | select(.title == "V88 official ferry fares and sailings — manual review") | .number' | head -n 1)
          if [ -z "$EXISTING" ]; then
            gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" --body-file /tmp/v88_issue.txt
          else
            PREVIOUS=$(gh issue view "$EXISTING" -R "$GITHUB_REPOSITORY" --json body,comments --jq '[.body, (.comments[].body)] | join("\n")')
            if ! printf '%s' "$PREVIOUS" | grep -Fq "V88 fingerprint: $FINGERPRINT"; then
              gh issue comment "$EXISTING" -R "$GITHUB_REPOSITORY" --body-file /tmp/v88_issue.txt
            else
              echo "Already reported this exact unresolved issue fingerprint."
            fi
          fi
