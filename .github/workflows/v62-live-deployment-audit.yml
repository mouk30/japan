name: V62 verify actual NIPPONFERRY production deployment
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v62-live-deployment-audit.yml
      - scripts/v62_check_live.mjs
permissions:
  contents: write
jobs:
  compare-production-to-main:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify production HTML, real photos and content over HTTP (not browser search cache)
        id: liveqa
        continue-on-error: true
        run: node scripts/v62_check_live.mjs
      - name: Upload production report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v62-production-deploy-http-check
          path: audit-reports/v62/live-site-qa.json
          retention-days: 21
          if-no-files-found: warn
      - name: Commit independent production check results
        if: always()
        run: |
          if [ ! -f audit-reports/v62/live-site-qa.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit-reports/v62/live-site-qa.json
          git diff --cached --quiet && exit 0
          git commit -m "V62: record actual production HTTP deployment verification"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Reject stale or mismatched production
        if: steps.liveqa.outcome != 'success'
        run: exit 1
