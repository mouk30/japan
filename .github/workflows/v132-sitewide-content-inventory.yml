name: V132 full site source and conversion quality inventory
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/v132_sitewide_quality_inventory.py'
      - '.github/workflows/v132-sitewide-content-inventory.yml'
permissions:
  contents: write
concurrency:
  group: v132-fullsite-current-content-inventory
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile full-site quality scanner
        run: python -m py_compile scripts/v132_sitewide_quality_inventory.py
      - name: Audit all current local HTML pages, covers, social images, return language and CTA
        run: python scripts/v132_sitewide_quality_inventory.py
      - name: Record audit artifacts in audit-reports without publishing new posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit-reports/v132/README.md audit-reports/v132/sitewide-inventory.json
          git commit -m "V132 archive current full-site image link return and booking QA evidence" || true
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v132-all-pages-content-quality-issue-inventory
          path: audit-reports/v132/
          retention-days: 45
