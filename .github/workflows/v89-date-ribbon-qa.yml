name: V89 official review-date and booking clarity QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/nf-v89-verified-date.css'
      - 'site/nf-v89-verified-date.js'
      - 'scripts/v89_date_ribbon_browser_qa.py'
      - 'site/guide/busan-*/index.html'
      - '.github/workflows/v89-date-ribbon-qa.yml'
permissions:
  contents: read
jobs:
  check-live:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install chromium --with-deps
      - name: Inspect production PC/mobile dates and direct official links; test simulated aging
        run: python scripts/v89_date_ribbon_browser_qa.py
      - name: Preserve actual screen captures and age-classification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v89-ferry-review-date-24-screens
          path: audit-output/v89-review-age/
          retention-days: 30
          if-no-files-found: warn
