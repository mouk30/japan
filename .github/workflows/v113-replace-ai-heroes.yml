name: V113 replace ten AI cruise-port headers with documented real photographs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/v113_replace_ai_heroes.py'
      - 'audit-reports/v113/photo-import-plan.json'
      - '.github/workflows/v113-replace-ai-heroes.yml'
permissions:
  contents: write
concurrency:
  group: v113-import-real-photos
  cancel-in-progress: false
jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lossless/WebP image tools
        run: python -m pip install "Pillow==11.3.0"
      - name: Retrieve ten exact Commons photographs, resize to WebP and preserve SEO
        run: python scripts/v113_replace_ai_heroes.py
      - name: Commit ten real photo files and updated existing pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/images/venues/nf-v113-*-real.webp site/things-to-do/*-cruise-port-day-trip/index.html audit-reports/v113/import-result.json
          if git diff --cached --quiet; then
            echo "No generated photo replacements to commit"
            exit 1
          fi
          git commit -m "V113 replace 10 AI port covers with Commons-credited landmark WebPs while preserving SEO"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v113-webp-import-and-source-evidence
          path: audit-reports/v113/import-result.json
          retention-days: 45
