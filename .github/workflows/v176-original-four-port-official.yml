name: V176 original 4 port tickets SEO and 16 live screens
on:
  push:
    branches: [main]
    paths:
      - "site/things-to-do/tomakomai-cruise-port-day-trip/index.html"
      - "site/things-to-do/nanao-cruise-port-day-trip/index.html"
      - "site/things-to-do/miyazaki-cruise-port-day-trip/index.html"
      - "site/things-to-do/imabari-cruise-port-day-trip/index.html"
      - "scripts/qa_v176_original_port_tickets.py"
      - "scripts/qa_v176_public_16.cjs"
      - ".github/workflows/v176-original-four-port-official.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-originals-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit original photos metadata SEO official links and build
        run: |
          python -m py_compile scripts/qa_v176_original_port_tickets.py
          python scripts/qa_v176_original_port_tickets.py
          node build.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v176-original-source-audit
          path: audit-output/v176/
  production-browser-16:
    needs: audit-originals-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify 4 live ports at 390 768 945 1440
        run: |
          node --check scripts/qa_v176_public_16.cjs
          node scripts/qa_v176_public_16.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v176-production-16-screens
          path: audit-output/v176-public/
