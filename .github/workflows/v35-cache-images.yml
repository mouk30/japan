name: V35 cache verified traditional craft real photos
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/v35-cache-images.yml

permissions:
  contents: write

jobs:
  cache-five-traditional-craft-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install WebP image encoder
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Fetch and verify 5 Wikimedia original photos
        run: python scripts/v35_cache_images.py
      - name: Verify 5 local WebP files
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          slugs = [
              'niigata-tsubame-sanjo-metalwork',
              'kumiko-japanese-wood-joinery',
              'japan-okinawan-bingata-textiles',
              'fukuoka-hakata-ori-textiles',
              'japan-sudare-bamboo-blinds',
          ]
          for slug in slugs:
              filepath = Path('site/images/culture-verified') / f'{slug}.webp'
              with Image.open(filepath) as img:
                  assert img.format == 'WEBP'
                  assert img.width >= 500
              page = (Path('site/things-to-do') / slug / 'index.html').read_text('utf-8')
              local = f'/images/culture-verified/{slug}.webp'
              assert f'src="{local}"' in page
              assert f'property="og:image" content="https://www.nipponferry.com{local}"' in page
              assert f'name="twitter:image" content="https://www.nipponferry.com{local}"' in page
              assert 'Wikimedia Commons' in page
          print("V35 local WebP / HTML / metadata checks passed: 5/5")
          PY
      - name: Commit five WebP images and five existing article updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for slug in             niigata-tsubame-sanjo-metalwork             kumiko-japanese-wood-joinery             japan-okinawan-bingata-textiles             fukuoka-hakata-ori-textiles             japan-sudare-bamboo-blinds; do
            git add "site/images/culture-verified/${slug}.webp"
            git add "site/things-to-do/${slug}/index.html"
          done
          git diff --cached --quiet && exit 0
          git commit -m "V35 assets: five licensed original craft photos as local WebP"
          git push
