name: V12.1 Family Couple Port Live QA
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit-companion-port-v12.mjs'
      - '.github/workflows/v12-companion-port-visual-qa.yml'
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build production output
        run: npm run build
      - name: Test mobile and desktop on build and live pages
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist > /tmp/nf-v12-1.log 2>&1 &
          sleep 2
          node scripts/audit-companion-port-v12.mjs
        env:
          LOCAL_BASE_URL: http://127.0.0.1:8765
          LIVE_BASE_URL: https://www.nipponferry.com
      - name: Save full quality report and example screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v12-1-family-couple-transport-qa
          path: audit-reports/companion-port-v12-visual/
          retention-days: 30
