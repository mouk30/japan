name: Tokyo V201-V220 and full 220-site quality audit
on:
  push:
    branches: [main]
    paths:
      - scripts/tokyo_v201_v220_editorial.py
      - scripts/tokyo_220_integrated_quality_audit.py
      - .github/workflows/tokyo-220-final-qa.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Editorial upgrade final 20
        run: python scripts/tokyo_v201_v220_editorial.py
      - name: Audit all Tokyo 220 articles
        run: python scripts/tokyo_220_integrated_quality_audit.py
      - name: Commit audit and final pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/japan/tokyo audit-reports/tokyo-v201-v220-editorial.json audit-reports/tokyo-220-integrated-quality-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Finish Tokyo V201–V220 editorial and run 220-page source QA"
            git pull --rebase origin main
            git push
          fi
