name: V353 Sitewide Card Image Inventory
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/audit-v353-sitewide-cards.mjs'
      - '.github/workflows/v353-sitewide-card-images.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scan sitewide image/title cards
        run: node scripts/audit-v353-sitewide-cards.mjs
      - name: Save full candidates report
        uses: actions/upload-artifact@v4
        with:
          name: v353-sitewide-card-image-inventory
          path: audit-reports/v353/
          retention-days: 30
