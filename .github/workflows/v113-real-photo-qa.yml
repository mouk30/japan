name: V113 ten real source photographs and SEO production checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/things-to-do/*-cruise-port-day-trip/index.html'
      - 'audit-reports/v113/**'
      - 'scripts/v113_photo_quality_audit.py'
      - 'scripts/v113_photo_live_qa.py'
      - 'tests/test_v113_photo_quality_audit.py'
      - '.github/workflows/v113-real-photo-qa.yml'
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Verify ten WebP images, licenses and immutable original SEO
        run: |
          python -m unittest discover -s tests -p 'test_v113_photo_quality_audit.py' -v
          python scripts/v113_photo_quality_audit.py
  production:
    needs: source-audit
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install chromium --with-deps
      - name: Inspect ten live pages (1440px and 390px), source credits and OG
        run: |
          for attempt in 1 2 3; do
            if python scripts/v113_photo_live_qa.py; then exit 0; fi
            echo "Publishing/CDN propagation, retry $attempt of 3"
            if [ "$attempt" -lt 3 ]; then sleep 30; fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v113-ten-real-landmark-images-pc-mobile-screens
          path: audit-output/v113/
          retention-days: 45
