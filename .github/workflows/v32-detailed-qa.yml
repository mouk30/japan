name: V32 Five Culture Photos and 27 Hero Triage QA
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit-v32-culture-render.mjs'
      - 'scripts/v32-triage-27-pages.py'
      - 'site/things-to-do/culture/index.html'
      - '.github/workflows/v32-detailed-qa.yml'
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Classify 27 unrecognized hero pages without inventing images
        run: python3 scripts/v32-triage-27-pages.py
      - name: Setup browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build website
        run: npm run build
      - name: Verify five real photos, credits, OG and mobile layouts
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist >/tmp/v32-qa-server.log 2>&1 &
          sleep 2
          node scripts/audit-v32-culture-render.mjs
      - name: Save 27 page triage and five desktop/mobile checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v32-culture-photo-and-hero-triage
          path: audit-reports/v32/
          retention-days: 30
