name: NIPPONFERRY V266 Sapporo Otaru photo rights gate
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v266-stay-sapporo-otaru:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve earlier stay KidsStay, ferry, image and region boundaries
        run: |
          node scripts/check-v251-stay-kids-boundary.mjs
          node scripts/check-v252-stay-ferry-clarity.mjs
          node scripts/check-v253-stay-images.mjs
          node scripts/check-v254-stay-local-verified.mjs
      - name: Verify Sapporo Otaru image holds, SEO, routes and 28-page scope
        run: node scripts/check-v266-stay-sapporo-otaru.mjs
      - name: Install Chromium for local render QA
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser QA Sapporo Otaru at 320, 390, 768 and 1440 pixels
        run: node scripts/browser-qa-v266-stay-sapporo-otaru.mjs
