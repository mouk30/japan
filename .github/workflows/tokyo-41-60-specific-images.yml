name: Tokyo cards 41-60 specific visual upgrade
on:
  push:
    branches: [main]
    paths:
      - scripts/tokyo_41_60_specific_images.py
      - .github/workflows/tokyo-41-60-specific-images.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/tokyo_41_60_specific_images.py
      - name: Persist 20 distinct visuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/images/tokyo-topics audit-reports/tokyo-41-60-specific-images.json
          if ! git diff --cached --quiet; then
            git commit -m "Upgrade Tokyo station cards 41-60 to subject-specific visuals"
            git pull --rebase origin main
            git push
          fi
