name: V301-V305 published premium header live verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v301-v305-live-qa.yml'
      - 'scripts/v301-v305-live-qa.mjs'
permissions:
  contents: write
jobs:
  production-header:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify 19 live routes, global two-row menus and navigation assets
        id: qa
        continue-on-error: true
        run: node scripts/v301-v305-live-qa.mjs
      - name: Archive real production result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-v301-v305-real-production-header
          path: audit-reports/v301-v305/live-production.json
          retention-days: 28
          if-no-files-found: warn
      - name: Commit audit record
        if: always()
        run: |
          test -f audit-reports/v301-v305/live-production.json || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit-reports/v301-v305/live-production.json
          git diff --cached --quiet && exit 0
          git commit -m "V305: archive 19 live public header roll-out results"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1
      - name: Alert deployment or missing navigation
        if: steps.qa.outcome != 'success'
        run: exit 1
