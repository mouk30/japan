name: V90 external ferry booking destination integrity
on:
  workflow_dispatch:
  schedule:
    - cron: '27 1,13 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/v90_booking_destination_health.py'
      - 'scripts/v90_booking_link_targets.json'
      - 'tests/test_v90_booking_destination_health.py'
      - '.github/workflows/v90-booking-links-watch.yml'
permissions:
  contents: read
  issues: write
concurrency:
  group: v90-ferry-booking-links
  cancel-in-progress: false
jobs:
  check-operator-links:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install link inspection dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Run offline tests for HTTPS operator destinations and error classifications
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_v90_booking_destination_health.py' -v 2>&1 | tee /tmp/v90-offline-tests.log
      - name: Archive exact offline assertion failures
        if: always()
        run: |
          mkdir -p audit-reports/v90/current
          if [ -f /tmp/v90-offline-tests.log ]; then
            cp /tmp/v90-offline-tests.log audit-reports/v90/current/offline-tests.log
            echo '### V90 exact unittest failures' >> "$GITHUB_STEP_SUMMARY"
            tail -n 65 /tmp/v90-offline-tests.log >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Diagnose local CTA markup after test failure
        if: failure()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.v90_booking_destination_health import examine_local
          config=json.loads(Path("scripts/v90_booking_link_targets.json").read_text(encoding="utf-8"))
          result=examine_local(config)
          print(json.dumps({"pages_checked":result["pages_checked"],"errors":result["errors"]},ensure_ascii=False,indent=2))
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("### V90 offline test failure diagnostics\\n")
              f.write(f"Local CTA markup errors: {len(result['errors'])}\\n")
              for item in result["errors"][:30]:
                  f.write("- "+json.dumps(item,ensure_ascii=False)+"\\n")
          PY
      - name: Check current operator destinations and 4 route CTA panels
        id: inspect
        run: python scripts/v90_booking_destination_health.py
      - name: Save full link response and redirect report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v90-booking-destination-health
          path: audit-reports/v90/current/
          retention-days: 90
          if-no-files-found: warn
      - name: Summarize trust vs uncertainty for humans
        if: always()
        run: |
          if [ -f audit-reports/v90/current/summary.md ]; then
            cat audit-reports/v90/current/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Open or update issue only for actionable broken/misdirected links
        if: steps.inspect.outputs.attention == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FINGERPRINT: ${{ steps.inspect.outputs.fingerprint }}
        run: |
          TITLE='V90 ferry booking destination — verify changed or broken link'
          {
            printf 'V90 fingerprint: %s\n\n' "$FINGERPRINT"
            cat audit-reports/v90/current/summary.md
            printf '\nRun: https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf '\nOnly verified operator links can replace URLs. A 403/429/JS gate is not a broken reservation service.\n'
          } >/tmp/v90_review_issue.txt
          EXISTING=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title --jq '.[] | select(.title == "V90 ferry booking destination — verify changed or broken link") | .number' | head -n 1)
          if [ -z "$EXISTING" ]; then
            gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" --body-file /tmp/v90_review_issue.txt
          else
            HISTORY=$(gh issue view "$EXISTING" -R "$GITHUB_REPOSITORY" --json body,comments --jq '[.body, (.comments[].body)] | join("\n")')
            if ! printf '%s' "$HISTORY" | grep -Fq "V90 fingerprint: $FINGERPRINT"; then
              gh issue comment "$EXISTING" -R "$GITHUB_REPOSITORY" --body-file /tmp/v90_review_issue.txt
            fi
          fi
